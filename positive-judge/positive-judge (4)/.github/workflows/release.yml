name: Build executables

# タグ(v0.1.0 など)を付けると、Windows・Mac・Linux 用の実行ファイルを作って Release に添付する。
# 「Actions」タブから手動で実行して、ビルドだけ試すこともできる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # Release にファイルを添付するために必要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            exe: dist/positive-judge.exe
          - os: macos-latest
            label: macos
            exe: dist/positive-judge
          - os: ubuntu-latest
            label: linux
            exe: dist/positive-judge
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"   # 日本語を文字化けさせないため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install janome pyinstaller

      - name: Download dictionary (bundled into the executable)
        # 日本語評価極性辞書(東北大学 乾・岡崎研究室)を配布元から取得して同梱する
        run: |
          python - <<'PY'
          import urllib.request
          base = "https://www.cl.ecei.tohoku.ac.jp/resources/sent_lex/"
          for name in ("wago.121808.pn", "pn.csv.m3.120408.trim"):
              urllib.request.urlretrieve(base + name, "positive_judge_data/" + name)
              print("downloaded", name)
          PY
          ls -l positive_judge_data

      - name: Build executable
        # janome の辞書データと、同梱した感情辞書を、実行ファイルの中に入れる
        run: pyinstaller --onefile --name positive-judge --collect-all janome --collect-all positive_judge_data positive_judge.py

      - name: Smoke test
        # 実行ファイルが起動し、同梱の辞書(約1万語以上)を読み込んで判定できることを確認する
        run: |
          out=$(./${{ matrix.exe }} "疲れたけど、楽しい一日だった。")
          echo "$out"
          echo "$out" | grep -E "[0-9]{5} "

      - name: Package
        run: |
          mkdir -p out
          if [ "${{ matrix.label }}" = "windows" ]; then
            cp ${{ matrix.exe }} out/positive-judge-windows.exe
          else
            # 実行権限を保ったまま配るため、tar.gz にする
            tar -czf out/positive-judge-${{ matrix.label }}.tar.gz -C dist positive-judge
          fi
          ls -l out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: positive-judge-${{ matrix.label }}
          path: out/*

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
